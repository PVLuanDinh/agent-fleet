version: 2

project_name: agent-fleet

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # naming files replaces goreleaser's defaults, so LICENSE and README repeat here
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  header: |
    Run every AI coding agent from one terminal. Claude Code, Codex, OpenCode, Grok Build, Gemini CLI, Antigravity CLI, Pi, Command Code, Hermes Agent, Muse Code, and Oh My Pi run side by side, each in its own tmux session, with live status, a project tree, quick prompt mode, and full-file diff review. Runs on macOS and Linux, and on Windows inside WSL2. [See it running](https://github.com/PVLuanDinh/agent-fleet#agent-fleet).

  footer: |
    ## Install

    ```bash
    # macOS / Linux
    brew install agent-fleet
    curl -fsSL https://raw.githubusercontent.com/PVLuanDinh/agent-fleet/main/install.sh | sh
    mise use -g ubi:PVLuanDinh/agent-fleet
    go install github.com/PVLuanDinh/agent-fleet@latest

    # Arch Linux
    yay -S agent-fleet-bin
    ```

    Prebuilt macOS and Linux binaries are attached below. Windows runs it inside WSL2.

    ## Get involved

    [Discussions](https://github.com/PVLuanDinh/agent-fleet/discussions) for questions and setups, [issues](https://github.com/PVLuanDinh/agent-fleet/issues) for bugs and ideas, [CONTRIBUTING.md](https://github.com/PVLuanDinh/agent-fleet/blob/main/.github/CONTRIBUTING.md) to send a patch.

homebrew_casks:
  - repository:
      owner: PVLuanDinh
      name: homebrew-tap
    homepage: https://github.com/PVLuanDinh/agent-fleet/
    description: Run Claude Code, Codex, OpenCode and other AI coding agents in tmux
    license: Apache-2.0
    binaries:
      - agent-fleet
    dependencies:
      - formula: tmux
    # Strips Gatekeeper quarantine from the download. goreleaser renders hooks
    # as the deprecated `postflight` block, so the declarative stanza goes
    # through custom_block; the doubled braces survive its template pass.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/agent-fleet"]
        end
      end

# git_url resolves to an empty string without AUR_KEY in the environment, and
# goreleaser skips the publish on an empty url, so a release without the key
# still succeeds.
aurs:
  - name: agent-fleet-bin
    homepage: https://github.com/PVLuanDinh/agent-fleet/
    description: Run Claude Code, Codex, OpenCode and other AI coding agents in tmux
    license: Apache-2.0
    maintainers:
      - PVLuanDinh <290538172+PVLuanDinh@users.noreply.github.com>
    depends:
      - tmux
      - git
    provides:
      - agent-fleet
    conflicts:
      - agent-fleet
    private_key: '{{ index .Env "AUR_KEY" }}'
    git_url: '{{ if index .Env "AUR_KEY" }}ssh://aur@aur.archlinux.org/agent-fleet-bin.git{{ end }}'
    package: |-
      install -Dm755 "./agent-fleet" "${pkgdir}/usr/bin/agent-fleet"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/agent-fleet-bin/LICENSE"
      install -Dm644 "./NOTICE" "${pkgdir}/usr/share/licenses/agent-fleet-bin/NOTICE"
